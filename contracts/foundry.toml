[profile.default]
src            = "src"
out            = "out"
libs           = ["lib"]
solc           = "0.8.24"
optimizer      = true
optimizer_runs = 200
via_ir         = false

[rpc_endpoints]
scroll_sepolia = "${NEXT_PUBLIC_SCROLL_SEPOLIA_RPC}"
anvil          = "http://127.0.0.1:8545"

[etherscan]
scroll_sepolia = { key = "verifykey", url = "https://sepolia-blockscout.scroll.io/api" }

[fmt]
line_length    = 100
tab_width      = 4
bracket_spacing = true
